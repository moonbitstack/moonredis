name: Check and Test

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  build:
    permissions:
      contents: read
    strategy:
      matrix:
        os: [ubuntu-26.04, macos-26, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: install-unix
        if: ${{ runner.os != 'Windows' }}
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: install-windows
        if: ${{ runner.os == 'Windows' }}
        run: |
          Set-ExecutionPolicy RemoteSigned -Scope CurrentUser; irm https://cli.moonbitlang.com/install/powershell.ps1 | iex
          "C:\Users\runneradmin\.moon\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: post install
        run: |
          moon version --all
          moon update

      - name: start redis (standalone, cluster, sentinel)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y redis-server redis-tools
          redis-server --port 6379 --daemonize yes --dir /tmp
          redis-cli -p 6379 ping
          # A six-node cluster: three masters, three replicas.
          for port in 7000 7001 7002 7003 7004 7005; do
            redis-server --port "$port" --cluster-enabled yes \
              --cluster-config-file "nodes-$port.conf" --cluster-node-timeout 5000 \
              --appendonly no --daemonize yes --dir /tmp
          done
          sleep 3
          redis-cli --cluster create \
            127.0.0.1:7000 127.0.0.1:7001 127.0.0.1:7002 \
            127.0.0.1:7003 127.0.0.1:7004 127.0.0.1:7005 \
            --cluster-replicas 1 --cluster-yes
          redis-cli -p 7000 cluster info | head -3
          # A sentinel watching the standalone master.
          printf 'port 26379\nsentinel monitor mymaster 127.0.0.1 6379 1\n' > /tmp/sentinel.conf
          redis-server /tmp/sentinel.conf --sentinel --daemonize yes --dir /tmp
          sleep 1
          redis-cli -p 26379 sentinel get-master-addr-by-name mymaster
          echo "MOONREDIS_LIVE=1" >> "$GITHUB_ENV"

      - name: moon check
        run: moon check --target all --deny-warn

      - name: moon build
        run: moon build --target all

      - name: moon test (all backends)
        run: moon test --target all

      - name: examples run
        if: runner.os == 'Linux'
        run: |
          for dir in src/examples/*/; do
            if grep -q 'kind: "executable"' "$dir/moon.pkg" && ! grep -q 'supported_targets = "js"' "$dir/moon.pkg"; then
              moon run "$dir" --target native > /dev/null
            fi
          done

      - name: lint (fmt is clean)
        run: |
          moon fmt && git diff --exit-code

      - name: interfaces are up to date
        run: |
          moon info --target all && git diff --exit-code
